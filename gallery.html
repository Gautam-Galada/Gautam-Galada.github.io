<div class="wrapper">

  <!-- Navigation -->

  <!-- ===== SECTION A: Photos ===== -->
  <p class="section-heading">Photos</p>

  <!-- TO ADD A PHOTO: Copy a <figure> block below, place your image in assets/photos/, then update src and caption. -->

  <div class="photo-grid">
    <figure>
      <img src="assets/photos/photo1.jpg" alt="Photo 1">
      <figcaption>[PLACEHOLDER caption]</figcaption>
    </figure>
    <figure>
      <img src="assets/photos/photo2.jpg" alt="Photo 2">
      <figcaption>[PLACEHOLDER caption]</figcaption>
    </figure>
    <figure>
      <img src="assets/photos/photo3.jpg" alt="Photo 3">
      <figcaption>[PLACEHOLDER caption]</figcaption>
    </figure>
  </div>

  <hr>

  <!-- ===== SECTION B: Blog Posts / Longer Reads ===== -->
  <p class="section-heading">Longer Reads</p>

  <!-- TO ADD A LONGER READ: Copy an <li> below and update the title, url, date, and description.
       Format:
       <li><a href="POST_URL" target="_blank" rel="noopener">Post Title</a>
           <span class="meta">YYYY-MM · One-line description</span></li>
  -->

  <ul class="post-list">
    <li>
      <a href="[PLACEHOLDER — URL]" target="_blank" rel="noopener">[PLACEHOLDER — Post Title]</a>
      <span class="meta">2026-05 · [PLACEHOLDER — description]</span>
    </li>
    <li>
      <a href="[PLACEHOLDER — URL]" target="_blank" rel="noopener">[PLACEHOLDER — Post Title]</a>
      <span class="meta">2026-04 · [PLACEHOLDER — description]</span>
    </li>
  </ul>

  <hr>
